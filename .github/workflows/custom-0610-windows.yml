name: Custom 0.6.10 Windows build

on:
  push:
    branches:
      - custom-0.6.10
    paths:
      - ".github/workflows/custom-0610-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact 0.6.10 source
        shell: pwsh
        run: |
          $parts = @(
            @{ url = "https://raw.githubusercontent.com/plexiglassss/openmw/383928b7bcf0a7f158a88149f487606288800bad/mwgc0610-core.part00"; out = "p00" },
            @{ url = "https://raw.githubusercontent.com/plexiglassss/openmw/eee7e18a2e437e0b93410ac50032b458c75c418e/mwgc0610-core.part01_02"; out = "p01_02" },
            @{ url = "https://raw.githubusercontent.com/plexiglassss/openmw/285c970fd2976df274a4bcb371aef1143f80b3b3/mwgc0610-core.part03_04"; out = "p03_04" },
            @{ url = "https://raw.githubusercontent.com/plexiglassss/openmw/764a2f0d697a55c8b3be1b831d68c4b78f8f3b0a/mwgc0610-core.part05_06"; out = "p05_06" },
            @{ url = "https://raw.githubusercontent.com/plexiglassss/openmw/7f148e3100755f075a443321da0de35c772a75dd/mwgc0610-core.part07_08"; out = "p07_08" },
            @{ url = "https://raw.githubusercontent.com/plexiglassss/openmw/902618a5dad7baccf935fedb8f4bcdf21335b821/mwgc0610-core.part09_10"; out = "p09_10" }
          )
          foreach ($p in $parts) {
            curl.exe -L --fail --retry 5 --retry-delay 2 $p.url -o $p.out
            if ($LASTEXITCODE -ne 0) { throw "Failed downloading $($p.url)" }
          }
          $b64 = ""
          foreach ($name in @("p00","p01_02","p03_04","p05_06","p07_08","p09_10")) {
            $b64 += (Get-Content -Raw $name).Trim()
          }
          [IO.File]::WriteAllBytes("mwgc0610-core.tar.xz", [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash "mwgc0610-core.tar.xz" -Algorithm SHA256).Hash.ToLower()
          Write-Host "Source SHA256: $hash"
          if ($hash -ne "052e46c799ca93165ec9b36ce2726ca9d907e43b77325e677cc7421476783f5c") {
            throw "Source SHA256 mismatch: $hash"
          }
          New-Item -ItemType Directory -Force mwgc-src | Out-Null
          tar -xJf mwgc0610-core.tar.xz -C mwgc-src
          if (!(Test-Path mwgc-src/CMakeLists.txt)) { throw "CMakeLists.txt missing after extraction" }
          (Get-Content -Raw mwgc-src/CMakeLists.txt).Replace("add_subdirectory(tst)", "") | Set-Content -NoNewline mwgc-src/CMakeLists.txt

      - name: Configure
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT "scripts/buildsystems/vcpkg.cmake"
          cmake -S mwgc-src -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$toolchain" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --target MWGroundcoverGenerator MWGroundcoverGeneratorCLI

      - name: Verify binaries
        shell: pwsh
        run: |
          if (!(Test-Path build/MWGroundcoverGenerator.exe)) { throw "GUI executable missing" }
          if (!(Test-Path build/MWGroundcoverGeneratorCLI.exe)) { throw "CLI executable missing" }
          Get-Item build/MWGroundcoverGenerator.exe, build/MWGroundcoverGeneratorCLI.exe | Format-List Name,Length
          Get-FileHash build/MWGroundcoverGenerator.exe -Algorithm SHA256
          Get-FileHash build/MWGroundcoverGeneratorCLI.exe -Algorithm SHA256

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build/MWGroundcoverGenerator.exe artifact/
          Copy-Item build/MWGroundcoverGeneratorCLI.exe artifact/
          Copy-Item mwgc-src/vcpkg.json artifact/
          Copy-Item mwgc-src/CMakeLists.txt artifact/
          Compress-Archive -Path mwgc-src/* -DestinationPath MWGroundcoverGenerator-0.6.10-Source.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MWGroundcoverGenerator-0.6.10-Windows-x64
          path: artifact
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: MWGroundcoverGenerator-0.6.10-Source
          path: MWGroundcoverGenerator-0.6.10-Source.zip
          if-no-files-found: error
