name: Custom 0.6.10 Windows build

on:
  push:
    branches:
      - custom-0.6.10
    paths:
      - ".github/workflows/custom-0610-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Reconstruct exact 0.6.10 source
        shell: pwsh
        run: |
          $names = @(
            ".mwgc-ci/source.part00",
            ".mwgc-ci/source.part01a",
            ".mwgc-ci/source.part02",
            ".mwgc-ci/source.part03a",
            ".mwgc-ci/source.part03b",
            ".mwgc-ci/source.part04",
            ".mwgc-ci/source.part05",
            ".mwgc-ci/source.part06"
          )
          $b64 = ""
          foreach ($name in $names) {
            if (!(Test-Path $name)) { throw "Missing source block: $name" }
            $b64 += (Get-Content -Raw $name).Trim()
          }
          if ($b64.Length -ne 103196) { throw "Unexpected Base64 length: $($b64.Length)" }
          [IO.File]::WriteAllBytes("mwgc0610-minsrc9.tar.xz", [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash "mwgc0610-minsrc9.tar.xz" -Algorithm SHA256).Hash.ToLower()
          Write-Host "Source SHA256: $hash"
          if ($hash -ne "f5466130cb51d91495e8f3a47342f2c3968d7e913155ec0746a1d4b6f13e4dfb") {
            throw "Source SHA256 mismatch: $hash"
          }
          New-Item -ItemType Directory -Force mwgc-src | Out-Null
          tar -xJf mwgc0610-minsrc9.tar.xz -C mwgc-src
          if (!(Test-Path mwgc-src/CMakeLists.txt)) { throw "CMakeLists.txt missing after extraction" }

          $cmake = Get-Content -Raw mwgc-src/CMakeLists.txt
          $cmake = $cmake.Replace("add_subdirectory(tst)", "")
          [IO.File]::WriteAllText((Join-Path $PWD "mwgc-src/CMakeLists.txt"), $cmake)

      - uses: lukka/get-cmake@latest

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        id: vcpkg
        with:
          runVcpkgInstall: false

      - name: Install pkg-config
        shell: pwsh
        run: |
          choco install pkgconfiglite --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey pkgconfiglite install failed" }
          $cmd = Get-Command pkg-config.exe -ErrorAction SilentlyContinue
          if (!$cmd) {
            $candidate = "C:\\ProgramData\\chocolatey\\bin\\pkg-config.exe"
            if (Test-Path $candidate) { $pkg = $candidate }
          } else {
            $pkg = $cmd.Source
          }
          if (!$pkg) { throw "pkg-config.exe not found after pkgconfiglite install" }
          Write-Host "Using pkg-config: $pkg"
          "PKG_CONFIG=$pkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear
        run: |
          $toolchain = Join-Path "${{ steps.vcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}" "scripts/buildsystems/vcpkg.cmake"
          $args = @(
            "-S", "mwgc-src",
            "-B", "build",
            "-A", "x64",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain",
            "-DVCPKG_TARGET_TRIPLET=x64-windows-static"
          )
          $ok = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Configure attempt $attempt of 3"
            & cmake @args
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
          }
          if (!$ok) { throw "CMake configure failed after 3 attempts" }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --target MWGroundcoverGenerator MWGroundcoverGeneratorCLI --parallel 2

      - name: Verify binaries
        shell: pwsh
        run: |
          $gui = "build/Release/MWGroundcoverGenerator.exe"
          $cli = "build/Release/MWGroundcoverGeneratorCLI.exe"
          if (!(Test-Path $gui)) { throw "GUI executable missing" }
          if (!(Test-Path $cli)) { throw "CLI executable missing" }
          Get-Item $gui, $cli | Format-List Name,Length
          Get-FileHash $gui -Algorithm SHA256
          Get-FileHash $cli -Algorithm SHA256

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build/Release/MWGroundcoverGenerator.exe artifact/
          Copy-Item build/Release/MWGroundcoverGeneratorCLI.exe artifact/
          Copy-Item mwgc0610-minsrc9.tar.xz artifact/MWGroundcoverGenerator-0.6.10-Source.tar.xz

      - uses: actions/upload-artifact@v4
        with:
          name: MWGroundcoverGenerator-0.6.10-Windows-x64
          path: artifact
          if-no-files-found: error
