name: Custom 0.6.10 Windows build

on:
  push:
    branches:
      - custom-0.6.10
    paths:
      - ".github/workflows/custom-0610-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact 0.6.10 source
        shell: pwsh
        run: |
          $names = @(
            ".mwgc-ci/source.part00",
            ".mwgc-ci/source.part01a",
            ".mwgc-ci/source.part02",
            ".mwgc-ci/source.part03a",
            ".mwgc-ci/source.part03b",
            ".mwgc-ci/source.part04",
            ".mwgc-ci/source.part05",
            ".mwgc-ci/source.part06"
          )
          $b64 = ""
          foreach ($name in $names) {
            if (!(Test-Path $name)) { throw "Missing source block: $name" }
            $b64 += (Get-Content -Raw $name).Trim()
          }
          if ($b64.Length -ne 103196) { throw "Unexpected Base64 length: $($b64.Length)" }
          [IO.File]::WriteAllBytes("mwgc0610-minsrc9.tar.xz", [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash "mwgc0610-minsrc9.tar.xz" -Algorithm SHA256).Hash.ToLower()
          Write-Host "Source SHA256: $hash"
          if ($hash -ne "f5466130cb51d91495e8f3a47342f2c3968d7e913155ec0746a1d4b6f13e4dfb") {
            throw "Source SHA256 mismatch: $hash"
          }
          New-Item -ItemType Directory -Force mwgc-src | Out-Null
          tar -xJf mwgc0610-minsrc9.tar.xz -C mwgc-src
          if (!(Test-Path mwgc-src/CMakeLists.txt)) { throw "CMakeLists.txt missing after extraction" }

          # Keep the source archive pristine; only omit tests from this build copy.
          $cmake = Get-Content -Raw mwgc-src/CMakeLists.txt
          $cmake = $cmake.Replace("add_subdirectory(tst)", "")
          Set-Content -NoNewline mwgc-src/CMakeLists.txt $cmake

      - name: Configure
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT "scripts/buildsystems/vcpkg.cmake"
          cmake -S mwgc-src -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$toolchain" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --target MWGroundcoverGenerator MWGroundcoverGeneratorCLI

      - name: Verify binaries
        shell: pwsh
        run: |
          if (!(Test-Path build/MWGroundcoverGenerator.exe)) { throw "GUI executable missing" }
          if (!(Test-Path build/MWGroundcoverGeneratorCLI.exe)) { throw "CLI executable missing" }
          Get-Item build/MWGroundcoverGenerator.exe, build/MWGroundcoverGeneratorCLI.exe | Format-List Name,Length
          Get-FileHash build/MWGroundcoverGenerator.exe -Algorithm SHA256
          Get-FileHash build/MWGroundcoverGeneratorCLI.exe -Algorithm SHA256

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build/MWGroundcoverGenerator.exe artifact/
          Copy-Item build/MWGroundcoverGeneratorCLI.exe artifact/
          Copy-Item mwgc0610-minsrc9.tar.xz artifact/MWGroundcoverGenerator-0.6.10-Source.tar.xz

      - uses: actions/upload-artifact@v4
        with:
          name: MWGroundcoverGenerator-0.6.10-Windows-x64
          path: artifact
          if-no-files-found: error
