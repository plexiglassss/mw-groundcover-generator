name: Custom 0.6.11 Windows build

on:
  push:
    branches:
      - custom-0.6.10
    paths:
      - ".github/workflows/custom-0610-windows.yml"
      - ".mwgc-ci/unicode-path-0.6.11.patch"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and patch exact 0.6.11 source
        shell: pwsh
        run: |
          $names = @(
            ".mwgc-ci/source.part00",
            ".mwgc-ci/source.part01a",
            ".mwgc-ci/source.part02",
            ".mwgc-ci/source.part03a",
            ".mwgc-ci/source.part03b",
            ".mwgc-ci/source.part04",
            ".mwgc-ci/source.part05",
            ".mwgc-ci/source.part06"
          )
          $b64 = ""
          foreach ($name in $names) {
            if (!(Test-Path $name)) { throw "Missing source block: $name" }
            $b64 += (Get-Content -Raw $name).Trim()
          }
          if ($b64.Length -ne 103196) { throw "Unexpected Base64 length: $($b64.Length)" }
          [IO.File]::WriteAllBytes("mwgc0610-minsrc9.tar.xz", [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash "mwgc0610-minsrc9.tar.xz" -Algorithm SHA256).Hash.ToLower()
          Write-Host "Base source SHA256: $hash"
          if ($hash -ne "f5466130cb51d91495e8f3a47342f2c3968d7e913155ec0746a1d4b6f13e4dfb") {
            throw "Source SHA256 mismatch: $hash"
          }
          New-Item -ItemType Directory -Force mwgc-src | Out-Null
          tar -xJf mwgc0610-minsrc9.tar.xz -C mwgc-src
          if (!(Test-Path mwgc-src/CMakeLists.txt)) { throw "CMakeLists.txt missing after extraction" }

          git apply --directory=mwgc-src .mwgc-ci/unicode-path-0.6.11.patch
          if ($LASTEXITCODE -ne 0) { throw "Unicode path patch did not apply cleanly" }
          if (!(Select-String -Quiet -Path mwgc-src/CMakeLists.txt -Pattern "VERSION 0.6.11")) {
            throw "0.6.11 version bump missing after patch"
          }

          # fmt 12 no longer exposes fmt::format from <fmt/core.h>.
          # Keep the source compatible with both current and older fmt versions.
          $fmtFiles = @(
            "mwgc-src/src/esp/EspReader.h",
            "mwgc-src/src/esp/EspReader.cpp",
            "mwgc-src/src/esp/MutableEsp.h"
          )
          foreach ($file in $fmtFiles) {
            $text = Get-Content -Raw $file
            $text = $text.Replace("#include <fmt/core.h>", "#include <fmt/format.h>")
            [IO.File]::WriteAllText((Join-Path $PWD $file), $text)
          }

      - uses: lukka/get-cmake@latest

      - name: Install pinned current vcpkg
        shell: pwsh
        run: |
          $vcpkgCommit = "5cad485d1ddb649c8fa1022bf0b3908555e6e6ba"
          git init vcpkg-current
          git -C vcpkg-current remote add origin https://github.com/microsoft/vcpkg.git
          git -C vcpkg-current fetch --depth=1 origin $vcpkgCommit
          if ($LASTEXITCODE -ne 0) { throw "Unable to fetch pinned vcpkg revision" }
          git -C vcpkg-current checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "Unable to check out pinned vcpkg revision" }
          $actual = (git -C vcpkg-current rev-parse HEAD).Trim()
          if ($actual -ne $vcpkgCommit) { throw "Unexpected vcpkg revision: $actual" }
          & .\vcpkg-current\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
          $root = (Resolve-Path vcpkg-current).Path
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Pinned vcpkg revision: $actual"

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            vcpkg-current/downloads
            vcpkg-current/packages
            build/vcpkg_installed
          key: mwgc-0611-${{ runner.os }}-vcpkg-5cad485d-${{ hashFiles('mwgc-src/vcpkg.json') }}

      - name: Configure
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear
        run: |
          $toolchain = Join-Path $env:VCPKG_ROOT "scripts/buildsystems/vcpkg.cmake"
          $args = @(
            "-S", "mwgc-src",
            "-B", "build",
            "-A", "x64",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain",
            "-DVCPKG_TARGET_TRIPLET=x64-windows-static"
          )
          & cmake @args
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }

      - name: Build GUI, CLI and tests
        shell: pwsh
        run: |
          cmake --build build --config Release --target MWGroundcoverGenerator MWGroundcoverGeneratorCLI MWGroundcoverGeneratorTests --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed" }

      - name: Run tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Regression tests failed" }

      - name: Verify binaries
        shell: pwsh
        run: |
          $gui = "build/Release/MWGroundcoverGenerator.exe"
          $cli = "build/Release/MWGroundcoverGeneratorCLI.exe"
          $tests = "build/tst/Release/MWGroundcoverGeneratorTests.exe"
          if (!(Test-Path $gui)) { throw "GUI executable missing" }
          if (!(Test-Path $cli)) { throw "CLI executable missing" }
          if (!(Test-Path $tests)) { throw "Test executable missing" }
          Get-Item $gui, $cli, $tests | Format-List Name,Length
          Get-FileHash $gui -Algorithm SHA256
          Get-FileHash $cli -Algorithm SHA256

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build/Release/MWGroundcoverGenerator.exe artifact/
          Copy-Item build/Release/MWGroundcoverGeneratorCLI.exe artifact/
          tar -cJf artifact/MWGroundcoverGenerator-0.6.11-Source.tar.xz -C mwgc-src .
          if ($LASTEXITCODE -ne 0) { throw "Unable to package matching patched source" }

      - uses: actions/upload-artifact@v4
        with:
          name: MWGroundcoverGenerator-0.6.11-Windows-x64
          path: artifact
          if-no-files-found: error
